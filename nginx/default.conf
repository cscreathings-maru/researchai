server {
    listen 80;
    server_name ui.researchai.umarsyukri.com;

    # Redirect all HTTP to HTTPS
    # (comment this out until you have the SSL cert)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ui.researchai.umarsyukri.com;

    # Let's Encrypt certificates (obtained via Certbot on the host)
    ssl_certificate     /etc/letsencrypt/live/ui.researchai.umarsyukri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ui.researchai.umarsyukri.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy to the Next.js container
    location / {
        proxy_pass         http://ui:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Longer timeout for PaperQA2 which can take ~120s
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}
