
services:

  # ── Next.js UI ───────────────────────────────────────────
  # Exposed on host port 3002 (3000 and 3100 are already taken).
  # System Nginx (already running on 80/443) proxies to this port.
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://researchai.umarsyukri.com
    container_name: researchai-ui
    restart: unless-stopped
    ports:
      - "3002:3000"

  # NOTE: No Nginx container here — your VPS already runs system Nginx
  # on ports 80/443. Add a server block to /etc/nginx/sites-available/
  # as described in the README to proxy port 3002.
